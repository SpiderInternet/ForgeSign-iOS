name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find Project and Build IPA
        run: |
          # البحث عن ملف .xcodeproj أو .xcworkspace داخل المستودع
          PROJ_PATH=$(find . -name "*.xcodeproj" -o -name "*.xcworkspace" | head -n 1)
          echo "Found project at: $PROJ_PATH"
          
          if [[ -z "$PROJ_PATH" ]]; then
            echo "No Xcode project found!"
            exit 1
          fi

          # تحديد نوع المشروع (workspace أم project)
          if [[ "$PROJ_PATH" == *.xcworkspace ]]; then
            BUILD_ARG="-workspace $PROJ_PATH"
          else
            BUILD_ARG="-project $PROJ_PATH"
          fi

          # جلب أول Scheme متوفر
          SCHEME=$(xcodebuild $BUILD_ARG -list | awk '/Schemes:/{flag=1; next} /^\s*$/{flag=0} flag' | xargs | awk '{print $1}')
          echo "Using Scheme: $SCHEME"

          # بناء الأرشيف
          xcodebuild archive \
            $BUILD_ARG \
            -scheme "$SCHEME" \
            -configuration Release \
            -archivePath build/App.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package Payload to IPA
        run: |
          mkdir -p build/IPA/Payload
          cp -r build/App.xcarchive/Products/Applications/*.app build/IPA/Payload/
          cd build/IPA
          zip -r ../ForgeSign.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ForgeSign-IPA
          path: build/ForgeSign.ipa
